          - generic [ref=f2e2270]:
            - paragraph [ref=f2e2271]: We, IKEA and our digital partners, use cookies and similar technologies across our websites. Some are strictly necessary for the functioning of the sites, and other optional cookies are used for measuring how you use the websites, enabling the customisation of the websites, advertising, marketing and social networks. Your cookie preferences here apply to all IKEA websites in Spain.
            - paragraph [ref=f2e2272]: Your consent also allows us to transfer certain data to our partners for processing in the US (e.g. Google). There is a European Commission adequacy decision for the US, which guarantees an adequate level of data protection in the US for data transferred to certified organisations in the United States under the EU–US Data Privacy Framework (DPF). It may not be easy to effectively exercise your rights in the US. You can revoke your consent at any time with effect for the future.
