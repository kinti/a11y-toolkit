name: Bug report
description: Something in the toolkit misbehaves (wrong finding, crash, bad output)
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool / module
      options:
        - a11y_audit_url (static audit)
        - a11y_audit_dom (rendered audit)
        - a11y_contrast_pair / a11y_suggest_color
        - a11y_contrast_image (text over image)
        - a11y_generate_declaration
        - a11y_snapshot / a11y_diff / a11y_diff_urls
        - a11y_criterion
        - a11y_aria_live_snippet
        - CLI (a11y …)
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Input used, expected result, actual result. Paste the JSON output if you have it.
    validations:
      required: true
  - type: input
    id: sample
    attributes:
      label: Sample URL or minimal HTML
      description: The smallest page that reproduces it (huge help for audit findings).
  - type: dropdown
    id: deps
    attributes:
      label: Environment
      options:
        - stdlib only (no Pillow / no Playwright)
        - with Playwright
        - with Pillow
        - PyPI install (uvx / pip)
  - type: checkboxes
    attributes:
      label: Honesty check
      options:
        - label: I understand automated findings are a filter (≈1/3 of WCAG), not a verdict — I believe this is a tool bug, not a manual-review case.
          required: true
