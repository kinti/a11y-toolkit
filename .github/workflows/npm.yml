# Publica el lanzador npm (@kinti/a11y-toolkit) al etiquetar una release.
# El motor sigue siendo Python/PyPI; esto es SOLO la puerta Node.
# Requiere el secreto NPM_TOKEN (npmjs.com → Access Tokens → Automation).
name: publish npm launcher
on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # trusted publishing (OIDC) hacia npm; contents: read lo demás
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Bundle the engine (self-contained package)
        run: |
          cp -r a11y_toolkit npm/a11y_toolkit
          find npm/a11y_toolkit -name __pycache__ -type d -prune -exec rm -rf {} +
          cp LICENSE npm/LICENSE
      - name: Publish
        run: npm publish ./npm --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
