# OpenSSF Scorecard — the industry-standard supply-chain security checklist.
# Runs weekly + on main; publishes results to the public Scorecard API (the
# badge in README reads from there). The score starts wherever it starts and
# climbs with real fixes per release — the house never paints the meter.
name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '17 4 * * 1'   # Mondays, off the crowded top of the hour
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
