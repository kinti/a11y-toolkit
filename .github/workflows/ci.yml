name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04  # 3.9 no existe en 26.04; el suelo del producto es 3.9
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pillow
      - run: pip install playwright && playwright install --with-deps chromium
      # CI = make test (descubrimiento completo): la lista manual omitía 8 suites
      - run: make test
      - name: Package smoke test (pip install .)
        run: |
          pip install .
          a11ytoolkit pair "#767676" "#ffffff"
          python3 -c "from a11y_toolkit import server, a11ydom; print('server imports OK,', len(server.TOOLS), 'tools,', len(server._PROMPTS), 'prompts')"
          # in-package data must survive the install: rgaa.json once crashed
          # pip copies (opened at import time by a11yrgaa)
          python3 -c "from a11y_toolkit import a11yrgaa; assert len(a11yrgaa.CRITERIA) == 106, 'rgaa.json missing from wheel'"
          pip uninstall -y a11y-toolkit
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
