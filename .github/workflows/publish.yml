name: Publish to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  registry:
    # el registro oficial de MCP (registry.modelcontextprotocol.io) lleva
    # stale desde 2026-09-18: las 5.26.0/5.27.0 nunca llegaron. OIDC hace
    # que la publicación sea automática en cada release — y manual con
    # workflow_dispatch cuando el server.json cambia sin release.
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # MCP registry OIDC (github-oidc)
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mcp-publisher (pinned v1.8.9)
        run: |
          curl -fsSL -o pub.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz"
          tar -xzf pub.tar.gz mcp-publisher
          chmod +x mcp-publisher && sudo mv mcp-publisher /usr/local/bin/
      - name: Wait for PyPI and npm to serve this version
        run: |
          # El registro valida AMBOS paquetes declarados en server.json
          # (PyPI + npm) contra sus índices públicos, y este workflow corre
          # en paralelo a los dos publishes: la carrera dio 400 "version
          # was not found" DOS veces en la 5.28.0 (17-nov) con build, publish
          # y npm en verde. Espera activa con techo de 8 minutos; si aún no
          # aparecen, se intenta igualmente: el registro es la autoridad
          # final y la guardia de abajo decide.
          VERSION="$(python3 -c "import json; print(json.load(open('server.json'))['version'])")"
          for i in $(seq 1 16); do
            PY="no"; NP="no"
            curl -fsS "https://pypi.org/pypi/a11y-toolkit/${VERSION}/json" > /dev/null 2>&1 && PY="ok"
            NP="$(curl -fsS "https://registry.npmjs.org/@kinti/a11y-toolkit" 2>/dev/null | python3 -c 'import json,sys; print("ok" if sys.argv[1] in json.load(sys.stdin).get("versions",{}) else "no")' "$VERSION")"
            echo "intento $i: pypi=$PY npm=$NP"
            [ "$PY" = "ok" ] && [ "$NP" = "ok" ] && exit 0
            sleep 30
          done
          echo "::notice::PyPI/npm siguen sin servir ${VERSION} tras 8 minutos; se intenta publicar igualmente"
      - name: Skip if this version is already in the MCP registry
        id: registry_guard
        run: |
          # El registro MCP también es inmutable por versión: republicar
          # server.json con una versión ya registrada da 400 duplicate
          # version (verificado en la run del 2026-11-14). Si la versión
          # ya está, el run queda verde con aviso. Un fallo de la
          # comprobación no bloquea: el registro es la autoridad final.
          VERSION="$(python3 -c "import json; print(json.load(open('server.json'))['version'])")"
          echo "server.json version: ${VERSION}"
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=a11y-toolkit&limit=100" -o /tmp/registry.json; then
            EXISTS="$(python3 -c 'import json, sys; d = json.load(open("/tmp/registry.json")); version = sys.argv[1]; print("true" if any((s.get("server") or {}).get("version") == version for s in d.get("servers", [])) else "false")' "$VERSION")"
          else
            echo "registry check failed; will attempt publish (registry is the final authority)"
            EXISTS="false"
          fi
          if [ "$EXISTS" = "true" ]; then
            echo "::notice::io.github.kinti/a11y-toolkit@${VERSION} is already in the MCP registry; publish skipped (versions are immutable there)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "version not in the registry; publishing"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish server.json to the MCP registry
        if: steps.registry_guard.outputs.skip != 'true'
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Skip if this version is already on PyPI
        id: pypi_guard
        run: |
          # PyPI es inmutable: republicar la misma versión da 400 File
          # already exists — el caso del workflow_dispatch sobre main, donde
          # el árbol lleva la versión ya publicada desde su tag (run roja
          # del 2026-11-12). Si ya está en PyPI, el run queda verde con
          # aviso y el job `registry` cumple su función igualmente. Un
          # fallo de la comprobación no bloquea: PyPI es la autoridad final.
          VERSION="$(ls dist/a11y_toolkit-*-py3-none-any.whl | sed -E 's#.*/a11y_toolkit-([^-]+)-py3-none-any\.whl#\1#')"
          echo "version in this tree: ${VERSION}"
          if curl -fsS "https://pypi.org/pypi/a11y-toolkit/${VERSION}/json" > /dev/null 2>&1; then
            echo "::notice::a11y-toolkit ${VERSION} is already on PyPI; upload skipped (PyPI versions are immutable). To ship new code, release a new version (make release V=x.y.z). The registry job still publishes server.json."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "not on PyPI yet; uploading"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to PyPI
        if: steps.pypi_guard.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
