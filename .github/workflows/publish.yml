name: Publish to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  registry:
    # el registro oficial de MCP (registry.modelcontextprotocol.io) lleva
    # stale desde 2026-09-18: las 5.26.0/5.27.0 nunca llegaron. OIDC hace
    # que la publicación sea automática en cada release — y manual con
    # workflow_dispatch cuando el server.json cambia sin release.
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # MCP registry OIDC (github-oidc)
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mcp-publisher (pinned v1.8.9)
        run: |
          curl -fsSL -o pub.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz"
          tar -xzf pub.tar.gz mcp-publisher
          chmod +x mcp-publisher && sudo mv mcp-publisher /usr/local/bin/
      - name: Publish server.json to the MCP registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Skip if this version is already on PyPI
        id: pypi_guard
        run: |
          # PyPI es inmutable: republicar la misma versión da 400 File
          # already exists — el caso del workflow_dispatch sobre main, donde
          # el árbol lleva la versión ya publicada desde su tag (run roja
          # del 2026-11-12). Si ya está en PyPI, el run queda verde con
          # aviso y el job `registry` cumple su función igualmente. Un
          # fallo de la comprobación no bloquea: PyPI es la autoridad final.
          VERSION="$(ls dist/a11y_toolkit-*-py3-none-any.whl | sed -E 's#.*/a11y_toolkit-([^-]+)-py3-none-any\.whl#\1#')"
          echo "version in this tree: ${VERSION}"
          if curl -fsS "https://pypi.org/pypi/a11y-toolkit/${VERSION}/json" > /dev/null 2>&1; then
            echo "::notice::a11y-toolkit ${VERSION} is already on PyPI; upload skipped (PyPI versions are immutable). To ship new code, release a new version (make release V=x.y.z). The registry job still publishes server.json."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "not on PyPI yet; uploading"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to PyPI
        if: steps.pypi_guard.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
