# Credibility upkeep: re-measure the toolkit vs axe-core on real pages monthly.
# Live sites drift — that is expected; the artifact is the evidence, the gate
# checks the declared pages, three completed passes per page and toolkit signals.
name: axe benchmark
on:
  schedule:
    - cron: '0 7 1 * *'   # first day of each month, 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install playwright && playwright install chromium --with-deps
      - name: Run and validate the benchmark on the declared pages
        run: |
          urls=(
            https://example.com
            https://www.gov.uk
            https://es.wikipedia.org/wiki/Wikipedia:Portada
            https://www.jquin.net
          )
          python3 bench/compara.py "${urls[@]}" > bench/results.json
          python3 bench/compara.py --check bench/results.json "${urls[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axe-benchmark
          path: bench/results.json

  # (results are committed to bench/results/<YYYY-MM>.json after each run —
  #  the January run should open a PR instead of manual commit)
